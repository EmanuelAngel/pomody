name: Desktop CI (Windows)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to attach binaries (e.g. pomody-v0.1.0)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to attach binaries (e.g. pomody-v0.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action reads the body from its `releaseBody` input, not from the release that
      # release-please already created, so the changelog has to be handed to it explicitly.
      # It ends up as the `notes` of latest.json, which the in-app update panel shows.
      - name: Read release notes
        id: notes
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          delimiter="NOTES_$(openssl rand -hex 8)"
          {
            echo "body<<${delimiter}"
            gh release view "$RELEASE_TAG" --json body --jq .body
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # With a release tag this builds, signs the updater bundle and uploads the installer,
      # its .sig and latest.json to the existing release. Without one it only builds: the
      # build-only config switches the updater artifacts off, so a pull request (whose
      # secrets may be unavailable, e.g. from a fork) never needs the private key.
      # `beforeBuildCommand` in tauri.conf.json builds the frontend, so no separate step.
      - name: Build Tauri desktop application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ inputs.release_tag == '' && '--config src-tauri/tauri.build-only.conf.json' || '' }}

      - name: Upload Windows installer and binary
        uses: actions/upload-artifact@v4
        with:
          name: Pomody-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pomody-desktop.exe
          if-no-files-found: warn

      # tauri-action attaches the installer, its signature and latest.json. The portable
      # executable is not a Tauri bundle, so it keeps its own step and its current asset name.
      - name: Attach portable executable to GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: src-tauri/target/release/pomody-desktop.exe

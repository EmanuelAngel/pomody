name: Desktop CI (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to attach binaries (e.g. pomody-v0.1.0)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to attach binaries (e.g. pomody-v0.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please')) &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend static SPA
        run: pnpm build

      - name: Build Tauri desktop application
        run: pnpm tauri:build

      - name: Upload Windows installer and binary
        uses: actions/upload-artifact@v4
        with:
          name: Pomody-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pomody-desktop.exe
          if-no-files-found: warn

      - name: Attach artifacts to GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pomody-desktop.exe

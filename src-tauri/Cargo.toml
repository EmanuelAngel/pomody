[package]
name = "pomody-desktop"
version = "0.18.0"
description = "Minimalist focus timer designed for deep work"
authors = ["Pomody Contributors"]
license = ""
repository = "https://github.com/EmanuelAngel/pomody"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pomody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "~2.7.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Pinned exactly (`=2.4.1`) on purpose, and diverging from the `~` convention used by
# the Tauri family: this plugin writes to Cargo.lock, so its version is chosen here
# and not delegated to Cargo. See docs/features/tray/decisions.md.
tauri-plugin-single-instance = { version = "=2.4.1", default-features = false }
# The only native surface of the distraction detector (src/window_bridge.rs). The feature
# list is exactly the five modules the bridge calls into, kept minimal on purpose: adding
# the whole `Win32` umbrella would drag unrelated modules into the build. Measured on a
# disposable copy before touching this file, and confirmed to reuse the `windows-sys
# 0.61.2` already in Cargo.lock instead of adding a fifth copy of the crate. See
# docs/features/distraction-detector/decisions.md §5.1.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
# OS notice of the distraction detector (src/lib/adapters/notification, spec §5). Pinned to
# the 2.4 minor on purpose: it is the newest version the pinned Tauri family admits, since
# 2.5 and above require `tauri = "2.12"` and moving the family is rule 8 territory. Measured
# on a disposable copy before this line existed; the refresh it applies is purely additive
# (18 new packages, zero existing lock entry changed, the whole Tauri family byte-identical).
# Consequence, documented in docs/features/distraction-detector/decisions.md §5.2: 2.4 has no
# desktop action API, so on Windows the notice is a faro and classification lives in the view.
tauri-plugin-notification = "~2.6.0"
